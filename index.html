<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .item-row { transition: all 0.2s ease; }
        .item-row:hover { background-color: #f9fafb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-6 shadow-md mb-6">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="Scanner 3 3 0 013 3v12a3 3 0 01-3 3H6a3 3 0 01-3-3V6a3 3 0 013-3h12zM16 8l-4 4m0 0l-4-4m4 4v8" />
                </svg>
                Minha Compra
            </h1>
            <button onclick="clearAll()" class="text-sm bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded transition">Limpar Tudo</button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4">
        <!-- Add Item Form -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 border border-gray-100">
            <h2 class="text-gray-700 font-semibold mb-4">Adicionar Novo Item</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <div class="md:col-span-2">
                    <input type="text" id="itemName" placeholder="Nome do produto" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="itemQty" placeholder="Qtd" value="1" min="1" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input type="number" id="itemPrice" placeholder="Preço R$" step="0.01" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button onclick="addItem()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition active:scale-95">
                    Adicionar
                </button>
            </div>
        </div>

        <!-- Items List -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            <div id="itemList" class="divide-y divide-gray-100">
                <!-- Items will be injected here -->
                <div id="emptyMessage" class="p-8 text-center text-gray-400 italic">
                    Nenhum item adicionado ainda.
                </div>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-3">
            <div class="flex justify-between text-gray-600">
                <span>Subtotal</span>
                <span id="subtotal">R$ 0,00</span>
            </div>
            <div class="flex justify-between items-center text-gray-600">
                <span>Desconto (%)</span>
                <input type="number" id="discountInput" oninput="updateTotals()" value="0" min="0" max="100" class="w-16 text-right p-1 bg-gray-50 border border-gray-200 rounded">
            </div>
            <hr class="border-gray-50">
            <div class="flex justify-between text-xl font-bold text-gray-800">
                <span>Total Final</span>
                <span id="totalFinal" class="text-indigo-600">R$ 0,00</span>
            </div>
        </div>
    </main>

    <!-- UI Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full opacity-0 pointer-events-none transition-opacity duration-300 shadow-xl text-sm">
        Item adicionado!
    </div>

    <script>
        let items = [];

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const qty = parseFloat(document.getElementById('itemQty').value);
            const price = parseFloat(document.getElementById('itemPrice').value);

            if (!name || isNaN(qty) || isNaN(price) || qty <= 0 || price < 0) {
                alert("Por favor, preencha todos os campos corretamente.");
                return;
            }

            const item = {
                id: Date.now(),
                name,
                qty,
                price,
                total: qty * price
            };

            items.push(item);
            renderItems();
            updateTotals();
            showToast("Item adicionado!");

            // Reset inputs
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '1';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemName').focus();
        }

        function removeItem(id) {
            items = items.filter(item => item.id !== id);
            renderItems();
            updateTotals();
        }

        function clearAll() {
            if (items.length === 0) return;
            if (confirm("Deseja realmente limpar toda a lista?")) {
                items = [];
                renderItems();
                updateTotals();
            }
        }

        function renderItems() {
            const container = document.getElementById('itemList');
            const emptyMsg = document.getElementById('emptyMessage');
            
            if (items.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyMsg);
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="item-row p-4 flex justify-between items-center animate-fade-in">
                    <div class="flex-1">
                        <h3 class="font-semibold text-gray-800">${item.name}</h3>
                        <p class="text-xs text-gray-500">${item.qty}x de R$ ${item.price.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-gray-700">R$ ${item.total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                        <button onclick="removeItem(${item.id})" class="text-red-400 hover:text-red-600 p-2 rounded-full hover:bg-red-50 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateTotals() {
            const subtotal = items.reduce((sum, item) => sum + item.total, 0);
            const discountPercent = parseFloat(document.getElementById('discountInput').value) || 0;
            const discountAmount = subtotal * (discountPercent / 100);
            const finalTotal = subtotal - discountAmount;

            document.getElementById('subtotal').textContent = `R$ ${subtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('totalFinal').textContent = `R$ ${Math.max(0, finalTotal).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        }
    </script>
</body>
</html>
